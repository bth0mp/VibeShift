name: Bug report
description: VibeShift closed, opened or switched something it shouldn't have (or didn't when it should)
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what VibeShift did instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: VibeShift version
      description: Settings, About.
      placeholder: "1.6.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Press Win+R, type winver and press Enter.
      placeholder: Windows 11 24H2
  - type: dropdown
    id: settings
    attributes:
      label: Which of these were on?
      multiple: true
      options:
        - Auto mode
        - Switch back when my game closes
        - Extra boost
        - Start with Windows
  - type: textarea
    id: log
    attributes:
      label: Log
      description: >
        The last lines of %APPDATA%\VibeShift\vibeshift.log (paste that path into File Explorer's address bar).
        It lists the apps VibeShift closed and opened and the games it saw; remove anything you'd rather not share.
      render: text
