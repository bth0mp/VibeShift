name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet build VibeShift.sln -c Release
      - run: dotnet test VibeShift.sln -c Release --no-build
      # Same single-file build as a release (uncompressed on purpose: compression doubles VibeShift's RAM use).
      - run: dotnet publish src/VibeShift -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - uses: actions/upload-artifact@v7
        with:
          name: VibeShift
          path: publish/VibeShift.exe
          retention-days: 14
