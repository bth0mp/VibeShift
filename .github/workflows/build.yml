name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      # Pinned to the same commits as release.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet build VibeShift.sln -c Release
      - run: dotnet test VibeShift.sln -c Release --no-build
      # Same single-file build as a release (uncompressed on purpose: compression doubles VibeShift's RAM use).
      - run: dotnet publish src/VibeShift -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      # Pushes to main only. A pull request's build is someone else's code: its exe must not sit on this repo's Actions
      # page, where the README sends people to download one.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: VibeShift
          path: publish/VibeShift.exe
          retention-days: 14
